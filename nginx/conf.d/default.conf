server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        autoindex on;          # Aktiviert das Verzeichnislisting
    }

    # Uncomment to redirect HTTP to HTTPS
    # return 301 https://$host$request_uri; 
}

