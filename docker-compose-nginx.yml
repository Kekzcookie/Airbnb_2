# docker compose -f docker-compose-nginx.yml up -d --build
# docker compose -f docker-compose-nginx.yml down

services:
  custom-nginx:
    build:
      context: .
      dockerfile: Dockerfile-nginx
    ports:
      - "8080:80"
      # - "443:443" # Bei Bedarf HTTPS aktivieren
    volumes:
      # Webinhalte einbinden
      - ./webcode_nginx:/usr/share/nginx/html
      # Benutzerdefinierte Nginx-Konfiguration einbinden
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      # Bei Bedarf SSL-Zertifikate für HTTPS einbinden
      # Erzeuge ein selbstsigniertes SSL-Zertifikat und einen Schlüssel mit OpenSSL 
      # https://www.humankode.com/ssl/create-a-selfsigned-certificate-for-nginx-in-5-minutes/
      # - ./certs/localhost.crt:/etc/ssl/certs/localhost.crt
      # - ./certs/localhost.key:/etc/ssl/certs/localhost.key
    restart: always
